[package]
name = "doors-of-durin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"

[dev-dependencies]
surfpool-sdk = "1.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
solana-instruction = "3.4"
solana-transaction = { version = "4.1", features = ["wincode"] }
solana-transaction-error = "3.3"
solana-rpc-client-types = "4.2"
token-acl-interface = "0.3"
sha2 = "0.9"

[lints.rust]
# Pinocchio's entrypoint macros use Solana's custom target OS.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
