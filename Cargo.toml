[package]
name = "token-acl-sas-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6"
solana-address = { version = "2", features = ["curve25519", "decode"] }
solana-msg = "3"
spl-discriminator = "0.5"
spl-tlv-account-resolution = "0.11"

[dev-dependencies]
surfpool-sdk = "1.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
solana-instruction = "3.4"
solana-transaction = { version = "4.1", features = ["wincode"] }
solana-transaction-error = "3.3"
solana-rpc-client-types = "4.2"
token-acl-interface = "0.3"
sha2 = "0.9"
token-acl-client = "0.3"
spl-token-2022-interface = "3.1"
solana-system-interface = { version = "3", features = ["bincode"] }
serde_json = "1"

[lints.rust]
# Pinocchio's entrypoint macros use Solana's custom target OS.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
