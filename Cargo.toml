[package]
name = "doors-of-durin"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = "0.11.2"

[dev-dependencies]
# SAS spike: issue attestations from the probe test via the first-party client
# crate, and decode them with borsh where convenient. Pinned per docs/SAS_SPIKE.md.
borsh = "1"
solana-attestation-service-client = "1.0.9"
solana-rpc-client = "2.3.13"
solana-sdk = "2.3.1"
tempfile = "3"

[lints.rust]
# Pinocchio's entrypoint macros use Solana's custom target OS.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
