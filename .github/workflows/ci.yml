name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repository default is write. These gates only read the checkout, and they
# run build scripts and Git hooks from an unreviewed branch, so the job token is
# narrowed here rather than left to inherit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    # mise.toml pins Agave assets for linux-x64 and macos-arm64 only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned by commit, and mise by release, so a change to the CI
      # environment is a reviewable diff like the Rust and SBF pins in mise.toml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here runs Git against the remote after the checkout.
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2026.9.12
          cache: true

      - name: Cache cargo and the SBF toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/solana
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'mise.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Installs the pinned SBF platform-tools. Also installs git hooks, which
      # CI does not use but which keeps this identical to a local checkout.
      - run: mise run setup

      # The pre-push stage is a superset of the pre-commit one: formatting,
      # Clippy, both host test configurations, the SBF build, and the surfnet
      # integration suite. The suite needs no network — SAS and Token ACL are
      # deployed from the pinned binaries in tests/fixtures/programs.
      - run: mise run verify
